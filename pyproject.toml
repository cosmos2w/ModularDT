[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honf-project"
version = "0.1.0"
description = "Case-neutral Hypergraph Operator Neural Field core and runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
visualization = ["matplotlib>=3.6", "scipy>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["honf_forward_core*", "honf_inverse_core*", "honf_runtime*", "honf_viz*"]

[tool.pytest.ini_options]
testpaths = ["tests", "Case_ThermalChannel/tests", "Case_WindFarm/tests", "Case_ElectroThermal/tests"]
pythonpath = ["src", "tests", "tools", "Case_ThermalChannel/src", "Case_WindFarm/src", "Case_ElectroThermal/src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
